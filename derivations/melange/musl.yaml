# SPDX-License-Identifier: Apache-2.0
#
# musl libc — the C standard library for TerranoxOS.
# This is the foundation package: everything else links against it.
#
# Build:
#   dagger call melange-build --source=. --package=musl

package:
  name: musl
  version: 1.2.5
  epoch: 0
  description: "musl C standard library"
  copyright:
    - license: MIT
  target-architecture:
    - x86_64
  checks:
    disabled:
      # The dynamic linker must be at /lib/ld-musl-x86_64.so.1 (ABI requirement)
      - usrmerge

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.19/main
    packages:
      - alpine-baselayout-data
      - busybox
      - ca-certificates-bundle
      - musl
      - musl-dev
      - build-base
      - wget

pipeline:
  - runs: |
      wget -q "https://musl.libc.org/releases/musl-1.2.5.tar.gz"
      echo "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  musl-1.2.5.tar.gz" | sha256sum -c
      tar xzf musl-1.2.5.tar.gz
      cd musl-1.2.5

      ./configure \
        --prefix=/usr \
        --disable-wrapper

      make -j$(nproc)
      make DESTDIR="${{targets.destdir}}" install

      # Dynamic linker symlink
      mkdir -p "${{targets.destdir}}/lib"
      ln -sf /usr/lib/libc.so "${{targets.destdir}}/lib/ld-musl-x86_64.so.1"

      # Build libssp_nonshared.a — Alpine's GCC expects this in musl-dev.
      # It provides __stack_chk_fail_local for -fstack-protector.
      cat > /tmp/ssp_nonshared.c <<'SSPEOF'
      extern void __stack_chk_fail(void);
      void __attribute__((visibility("hidden"))) __stack_chk_fail_local(void) {
          __stack_chk_fail();
      }
      SSPEOF
      gcc -c -O2 -fPIC -o /tmp/ssp_nonshared.o /tmp/ssp_nonshared.c
      ar rcs "${{targets.destdir}}/usr/lib/libssp_nonshared.a" /tmp/ssp_nonshared.o

subpackages:
  - name: musl-dev
    description: "musl C library development headers and static libs"
    dependencies:
      runtime:
        - musl
    pipeline:
      - runs: |
          # Move headers and static libs from main package into -dev subpackage
          mkdir -p "${{targets.subpkgdir}}/usr/include"
          mkdir -p "${{targets.subpkgdir}}/usr/lib"

          mv "${{targets.destdir}}/usr/include"/* "${{targets.subpkgdir}}/usr/include/"
          mv "${{targets.destdir}}/usr/lib"/*.a "${{targets.subpkgdir}}/usr/lib/" 2>/dev/null || true
          mv "${{targets.destdir}}/usr/lib"/*.o "${{targets.subpkgdir}}/usr/lib/" 2>/dev/null || true

          # musl-dev also needs the .specs file and libc.so linker script
          mv "${{targets.destdir}}/usr/lib/musl-gcc.specs" "${{targets.subpkgdir}}/usr/lib/" 2>/dev/null || true
