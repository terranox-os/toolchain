# SPDX-License-Identifier: Apache-2.0
#
# apko configuration for TerranoxOS musl toolchain image.
#
# Self-hosted LLVM/Clang toolchain with musl sysroot, build tools,
# and development libraries. Zero GNU dependencies — pure LLVM stack.
#
# Build:
#   dagger call build-toolchain-image --source=.
#
# Or with pre-built packages:
#   dagger call apko-build --config=derivations/apko/toolchain-musl.yaml --source=.

contents:
  keyring:
    - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
    - /etc/apk/keys/melange.rsa.pub
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.21/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.21/community
    - /packages
  packages:
    # -- TerranoxOS toolchain --
    - terranox-clang
    - terranox-sysroot

    # -- Core system --
    - alpine-baselayout
    - alpine-keys
    - busybox
    - musl
    - musl-utils
    - ca-certificates-bundle
    - ssl_client

    # -- Build tools --
    - cmake
    - ninja
    - samurai
    - make
    - pkgconf
    - patch
    - file

    # -- Dev headers + static libs --
    - musl-dev
    - linux-headers
    - zlib-dev
    - zlib-static
    - openssl-dev
    - openssl-libs-static
    - ncurses-dev
    - readline-dev

    # -- VCS + scripting --
    - git
    - python3
    - perl
    - bash

    # -- Utilities --
    - curl
    - wget
    - tar
    - gzip
    - xz
    - coreutils
    - findutils
    - grep
    - sed
    - gawk

archs:
  - x86_64

environment:
  PATH: /usr/bin:/usr/sbin:/bin:/sbin
  CC: clang
  CXX: clang++
  LD: ld.lld
  AR: llvm-ar
  RANLIB: llvm-ranlib
  TERRANOX_SYSROOT: /usr/share/terranox-sysroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

accounts:
  groups:
    - groupname: build
      gid: 1000
  users:
    - username: build
      uid: 1000
      gid: 1000
      shell: /bin/bash
  run-as: 0

entrypoint:
  command: /bin/bash

work-dir: /workspace

annotations:
  org.opencontainers.image.title: "TerranoxOS Musl Toolchain"
  org.opencontainers.image.description: "Self-hosted LLVM/Clang toolchain with musl sysroot — zero GNU dependencies"
  org.opencontainers.image.vendor: "TerranoxOS"
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.version: "21.1.8"
  terranox.llvm.version: "21.1.8"
  terranox.musl.version: "1.2.5"
  terranox.target: "x86_64-linux-musl"
  terranox.variant: "toolchain"
